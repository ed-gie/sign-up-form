<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="sign-up-form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="left">
        <div class="logo_container">
            <img class="logo" src="odin-lined.png" alt="odin logo">
            <h1 class="odin_text">ODIN</h1>
        </div>
    </div>
    <div class="right">
        <div class="top">
            <h3>This is not a real online service! You know you need something like this in your life to help you
                realize your deepest dreams. Sign up <em>now</em> to get started.</h3>
            <h3>You <em>know</em> you want to.</h3>
        </div>
        <div class="form">
            <h3>Let's do this!</h3>
            <form action="" method="post">
                <fieldset>
                    <div class="box first_name">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="box last_name">

                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                    <div class="box email">

                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="box phone_number">

                        <label for="phone_number"> PHONE NUMBER</label>
                        <input type="text" id="phone_number" name="phone_number" required>
                    </div>
                    <div class="box password">

                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="box confirm_password">

                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </fieldset>
            </form>
        </div>
        <div class="bottom">
            <button class="create">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>

        </div>
    </div>
</body>

</html>
